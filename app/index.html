<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morning</title>
<meta name="description" content="Paul's morning screen.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Morning">
<meta name="theme-color" content="#EEEDE9">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="nocode" class="nocode" hidden>
  <p class="nocode-title">Good morning.</p>
  <p>This screen opens from your private link, the same one as the to-do app.</p>
</div>

<div id="app" class="page" hidden>
  <header class="head">
    <div class="head-date">
      <span class="head-day js-day"></span>
      <h1 class="date js-date"></h1>
    </div>
    <div class="clocks">
      <div class="clock clock-far"><span class="clock-label">Miami</span><span class="clock-time" data-clock="miami"></span></div>
      <div class="clock clock-far"><span class="clock-label">Ecuador</span><span class="clock-time" data-clock="ecuador"></span></div>
      <span class="clock-here" data-clock="here"></span>
    </div>
  </header>

  <div class="cols">
    <div class="col col-a">
      <section id="start" class="card card-start" aria-label="Start with" hidden>
        <span class="num">01 Start with</span>
        <p class="start-text"></p>
      </section>

      <section class="card" aria-label="Today">
        <div class="card-head">
          <span class="num">02 Today</span>
          <a id="todoLink" class="card-link" href="../todo/">Open to-do app</a>
        </div>
        <ul id="todayList" class="rows"></ul>
      </section>
    </div>

    <div class="col col-b">
      <section id="projects" class="card" aria-label="Projects" hidden>
        <div class="card-head">
          <span class="num">03 Projects</span>
          <span id="projUpdated" class="card-note"></span>
        </div>
        <div id="projList" class="rows"></div>
      </section>
    </div>

    <div class="col col-c">
      <section class="card" aria-label="This week">
        <span class="num">04 Week</span>
        <div id="days" class="rows"></div>
        <span id="calNote" class="card-note card-foot"></span>
      </section>

      <section id="arsenal" class="card card-row" aria-label="Arsenal">
        <div id="arsenalBody" class="fx"></div>
      </section>
    </div>
  </div>

  <footer class="foot">
    <span class="foot-clocks">Miami <span data-clock="miami"></span> · Ecuador <span data-clock="ecuador"></span></span>
    <span id="asOf" class="as-of"></span>
  </footer>
</div>

<script src="arsenal.js"></script>
<script src="app.js"></script>
</body>
</html>
