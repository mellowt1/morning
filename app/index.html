<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morning</title>
<meta name="description" content="Paul's morning screen.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Morning">
<meta name="theme-color" content="#EEEDE9">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<script src="sun.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="nocode" class="nocode" hidden>
  <p class="nocode-title">Good morning.</p>
  <p>This screen opens from your private link, the same one as the to-do app.</p>
</div>

<div id="app" class="page" hidden>
  <header class="head">
    <div class="head-date">
      <span class="eyebrow js-eyebrow"></span>
      <h1 class="date js-date"></h1>
    </div>
    <div class="clocks">
      <div class="clock clock-far"><span class="clock-label">Miami</span><span class="clock-time" data-clock="miami"></span></div>
      <div class="clock clock-far"><span class="clock-label">Ecuador</span><span class="clock-time" data-clock="ecuador"></span></div>
      <span class="clock-here" data-clock="here"></span>
    </div>
  </header>
  <p class="say js-say" aria-live="polite"></p>

  <div class="cols">
    <div class="col col-a">
      <a id="start" class="card card-start" href="../todo/" style="--i:0" hidden>
        <span class="num"><span>01 Start with</span><span class="start-go" aria-hidden="true">Open ›</span></span>
        <span class="start-text"></span>
      </a>

      <section class="card" aria-label="Today" style="--i:1">
        <div class="card-head">
          <span class="num">02 Today</span>
          <a id="todoLink" class="card-link" href="../todo/">Open to-do app</a>
        </div>
        <div id="todayList"></div>
      </section>
    </div>

    <div class="col col-b">
      <section id="projects" class="card" aria-label="Projects" style="--i:2" hidden>
        <div class="card-head">
          <span class="num">03 Projects</span>
          <span id="projUpdated" class="card-note"></span>
        </div>
        <div id="projList"></div>
      </section>
    </div>

    <div class="col col-c">
      <section id="coming" class="card" aria-label="Coming up" style="--i:3">
        <span class="num">04 Coming up</span>
        <div id="days" class="rows"></div>
        <span id="calNote" class="card-note card-foot"></span>
      </section>

      <section id="arsenal" class="card card-row card-arsenal" aria-label="Arsenal" style="--i:4">
        <img class="fx-crest" src="https://a.espncdn.com/i/teamlogos/soccer/500/359.png" alt="" width="40" height="40" decoding="async" onerror="this.remove()">
        <div id="arsenalBody" class="fx"></div>
      </section>
    </div>
  </div>

  <!-- PC only (1100 px and up): the week across the bottom, one column per day. -->
  <section id="weekBand" class="card week-band" aria-label="Week" style="--i:5">
    <div class="card-head">
      <span class="num">04 Week</span>
      <span id="bandNote" class="card-note"></span>
    </div>
    <div id="bandDays" class="band-days"></div>
  </section>

  <footer class="foot">
    <span id="asOf" class="as-of"></span>
  </footer>
</div>

<script src="arsenal.js"></script>
<script src="app.js"></script>
</body>
</html>
