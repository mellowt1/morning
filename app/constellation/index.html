<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Constellation</title>
<meta name="description" content="The apps on the hub as stars, and what they told each other this week.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0A0E17">
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="constellation.css">
</head>
<body>
<svg id="field" class="field" aria-hidden="true" focusable="false"></svg>
<main id="app" class="page">
  <header class="top">
    <a id="back" class="back" href="../">‹ Morning</a>
    <h1>Constellation</h1>
    <div class="seg" role="group" aria-label="Show">
      <button type="button" data-mode="live" aria-pressed="true">Live</button>
      <button type="button" data-mode="day" aria-pressed="false">Last day</button>
      <button type="button" data-mode="week" aria-pressed="false">Last week</button>
    </div>
    <p id="status" class="status">Loading…</p>
  </header>
  <p id="note" class="note" hidden></p>
  <!-- The sky (GET /api/sky/:code, paul-hub src/sky.js): the stars are buttons over a drawn SVG;
       a line is a focusable stroke. Only star names, labels, counts and times are ever shown. -->
  <div class="stage">
    <div id="skyarea" class="skyarea">
      <div id="sky" class="sky">
        <div id="stars" class="stars"></div>
        <svg id="chart" class="chart" role="group" aria-label="Lines between the apps"></svg>
        <div id="fx" class="fx" aria-hidden="true"></div>
      </div>
      <div id="away" class="away" hidden>
        <p>Can’t reach the hub.</p>
        <button type="button" id="retry" class="btn">Retry</button>
      </div>
    </div>
    <div class="band">
      <p id="legend" class="legend">Brighter: more events this week · Dim: quiet past its limit · A line: two apps that told each other something</p>
      <section id="replay" class="bar replay" aria-label="Replay" hidden>
        <button type="button" id="play" class="play" aria-label="Pause">
          <svg class="i-pause" width="14" height="16" viewBox="0 0 14 16" aria-hidden="true" focusable="false"><rect x="1" y="1" width="4" height="14" rx="1"></rect><rect x="9" y="1" width="4" height="14" rx="1"></rect></svg>
          <svg class="i-play" width="14" height="16" viewBox="0 0 14 16" aria-hidden="true" focusable="false"><path d="M2 1.6v12.8c0 .8.9 1.3 1.6.8l9.4-6.4c.6-.4.6-1.2 0-1.6L3.6.8C2.9.3 2 .8 2 1.6z"></path></svg>
        </button>
        <div class="track">
          <label for="scrub" class="sr">Time in the replay</label>
          <input type="range" id="scrub" class="scrub" min="0" max="1000" step="1" value="0">
          <div id="ticks" class="ticks" aria-hidden="true"></div>
        </div>
        <span id="replayK" class="bar-k"></span>
      </section>
      <section id="stepper" class="bar stepper" aria-labelledby="stepK" hidden>
        <span id="stepK" class="step-k"></span>
        <div class="step-row">
          <button type="button" id="prev" class="step-btn" aria-label="Previous">‹</button>
          <div class="step-body" aria-live="polite">
            <span id="stepLabel" class="step-l"></span>
            <span id="stepWho" class="step-w"></span>
          </div>
          <button type="button" id="next" class="step-btn" aria-label="Next">›</button>
        </div>
      </section>
    </div>
    <section id="panel" class="panel" aria-labelledby="panelH" hidden>
      <div class="pn-head">
        <h2 id="panelH" tabindex="-1"></h2>
        <button type="button" id="close" class="close" aria-label="Close">×</button>
      </div>
      <div id="panelBody"></div>
    </section>
  </div>
</main>
<p id="nocode" class="nocode" hidden>Open Morning from your private link first; this page uses the same one.</p>
<script src="constellation.js"></script>
</body>
</html>
